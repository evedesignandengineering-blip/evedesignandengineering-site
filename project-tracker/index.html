<html lang="en">
<head>

<title>EVE Project Control | Project Tracker</title>
<meta name="description" content="EVE Design & Engineering internal project control and engineering project tracking workspace.">
<style>
:root{--navy:#081522;--navy2:#10253a;--ink:#162536;--muted:#708094;--line:#e4eaf0;--bg:#f4f7fa;--card:#fff;--blue:#2563eb;--green:#14805b;--amber:#a96800;--red:#c33d45;--purple:#7357c8;--shadow:0 12px 30px rgba(17,35,55,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.side{width:238px;background:linear-gradient(180deg,var(--navy),#0d1e31);color:#fff;position:fixed;inset:0 auto 0 0;padding:22px 14px;z-index:5}.brand{display:flex;align-items:center;gap:10px;padding:4px 12px 25px}.brandmark{font-size:26px;font-weight:900;letter-spacing:-2px}.brand i{display:block;width:2px;height:30px;background:#4cc4a0;transform:skew(-20deg)}.brand span{font-size:11px;line-height:1.15;color:#b9c7d7;font-weight:700}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:800;color:#8295aa;margin:8px 12px 9px}.nav a{display:flex;align-items:center;gap:11px;color:#b7c5d4;text-decoration:none;padding:11px 12px;border-radius:9px;margin:2px 0;font-size:13px;font-weight:650}.nav a:hover,.nav a.active{background:#183149;color:#fff}.nav .ico{width:20px;text-align:center;opacity:.9}.side-foot{position:absolute;bottom:18px;left:18px;right:18px;border-top:1px solid #244057;padding-top:14px;color:#7f93a8;font-size:10px;line-height:1.5}.main{margin-left:238px;min-height:100vh;width:calc(100% - 238px)}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.search{width:min(380px,42vw);background:#f5f7fa;border:1px solid var(--line);border-radius:9px;padding:10px 13px;outline:none}.top-right{display:flex;align-items:center;gap:12px}.badge{font-size:10px;font-weight:800;color:#8b5d00;background:#fff7df;border:1px solid #f0dda4;padding:7px 9px;border-radius:7px}.avatar{width:34px;height:34px;border-radius:50%;background:#dbeafe;color:#1e40af;display:grid;place-items:center;font-size:12px;font-weight:800}.page{padding:30px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.head h1{font-size:27px;letter-spacing:-.7px;margin:0 0 5px}.head p{margin:0;color:var(--muted);font-size:13px}.primary{border:0;background:var(--blue);color:#fff;padding:11px 16px;border-radius:8px;font-weight:750;box-shadow:0 5px 13px rgba(37,99,235,.2)}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:8px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.kpi{padding:17px}.kpi-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:700}.kpi strong{display:block;font-size:27px;margin-top:9px;letter-spacing:-.8px}.delta{font-size:10px;margin-top:7px;color:var(--green)}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}.panel{padding:18px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-title h2{font-size:14px;margin:0}.panel-title span{font-size:10px;color:var(--muted)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:#8090a0;font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);padding:9px}.table td{padding:13px 9px;border-bottom:1px solid #edf1f4;vertical-align:middle}.table tr:last-child td{border-bottom:0}.click{cursor:pointer}.click:hover{background:#fafcff}.pid{font-size:10px;color:var(--blue);font-weight:800}.pname{font-weight:750;margin-top:2px}.muted{color:var(--muted)}.status,.priority{display:inline-flex;align-items:center;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:800}.status.Active{background:#e7f7ef;color:#16724f}.status.Planning{background:#edf3ff;color:#315fb7}.status.On\ Hold{background:#f1f3f5;color:#697582}.status.Completed{background:#eaf7f0;color:#1a7a54}.priority.High{background:#fff0f0;color:#b3363e}.priority.Medium{background:#fff7e5;color:#9a6408}.priority.Low{background:#edf7ff;color:#2b6ba5}.progress{height:6px;background:#edf1f4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}.side-list{display:grid;gap:9px}.activity{display:flex;gap:10px}.dot{width:8px;height:8px;background:#2c78ee;border-radius:50%;margin-top:5px;flex:0 0 auto}.activity b{font-size:11px}.activity p{margin:3px 0 0;color:var(--muted);font-size:10px;line-height:1.45}.filterbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filterbar input,.filterbar select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;outline:none;font-size:12px}.filterbar input{min-width:260px}.project-detail{display:none}.project-detail.show{display:block}.back{border:0;background:transparent;color:var(--blue);padding:0;margin-bottom:15px;font-weight:750}.detail-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.detail-head h1{font-size:25px;margin:5px 0}.detail-meta{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-top:20px}.tab{border:0;background:transparent;padding:10px 12px;font-size:11px;font-weight:750;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}.tabpane{display:none;padding-top:18px}.tabpane.active{display:block}.twocol{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.info{border:1px solid var(--line);border-radius:9px;padding:12px;background:#fbfcfd}.info small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:800;margin-bottom:4px}.info b{font-size:12px}.modal{position:fixed;inset:0;background:rgba(5,15,25,.58);display:none;place-items:center;padding:20px;z-index:20}.modal.show{display:grid}.modal-card{background:#fff;border-radius:14px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.25)}.modal-head{padding:19px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-head h2{font-size:17px;margin:0}.close{border:0;background:#f2f4f7;border-radius:50%;width:28px;height:28px}.form{padding:21px;display:grid;gap:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form label{font-size:10px;font-weight:800;color:#566779}.form input,.form select,.form textarea{width:100%;margin-top:6px;border:1px solid #dbe2e9;border-radius:8px;padding:10px 11px;outline:none;background:#fff;font-size:12px}.form textarea{min-height:85px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:5px}.empty{padding:35px;text-align:center;color:var(--muted);font-size:12px}.toast{position:fixed;right:24px;bottom:24px;background:#10243a;color:#fff;padding:12px 15px;border-radius:9px;font-size:11px;box-shadow:0 10px 25px rgba(0,0,0,.2);display:none;z-index:30}.toast.show{display:block}.notice{background:#eef5ff;border:1px solid #d8e6ff;color:#31527f;border-radius:9px;padding:10px 12px;font-size:10px;margin-bottom:18px}.mobile{display:none}@media(max-width:900px){.side{width:70px;padding:18px 8px}.brand span,.brand i,.eyebrow,.nav a span,.side-foot{display:none}.brand{padding:4px 9px 25px}.nav a{justify-content:center}.main{margin-left:70px;width:calc(100% - 70px)}.cards{grid-template-columns:1fr 1fr}.grid,.twocol{grid-template-columns:1fr}.page{padding:20px}.top{padding:0 18px}.search{width:50vw}.head{align-items:flex-start}.info-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr;gap:9px}.kpi strong{font-size:21px}.head{flex-direction:column}.top-right .badge{display:none}.top{height:62px}.page{padding:16px}.form-grid{grid-template-columns:1fr}.filterbar input{min-width:100%;width:100%}.table-wrap{overflow:auto}.table{min-width:720px}.detail-head{flex-direction:column}.tabs{overflow:auto}.tab{white-space:nowrap}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><b class="brandmark">EVE</b><i></i><span>DESIGN &amp;<br>ENGINEERING</span></div>
  <div class="eyebrow">PROJECT CONTROL</div>
  <nav class="nav">
    <a href="#dashboard" data-page="dashboard" class="active"><span class="ico">▦</span><span>Dashboard</span></a>
    <a href="#projects" data-page="projects"><span class="ico">▣</span><span>Projects</span></a>
    <a href="#tasks" data-page="tasks"><span class="ico">✓</span><span>Tasks</span></a>
    <a href="#documents" data-page="documents"><span class="ico">▤</span><span>Documents</span></a>
    <a href="#team" data-page="team"><span class="ico">◉</span><span>Team</span></a>
    <a href="#reports" data-page="reports"><span class="ico">▥</span><span>Reports</span></a>
  </nav>
  <div class="eyebrow" style="margin-top:22px">WORKSPACE</div>
  <nav class="nav"><a href="#settings" data-page="settings"><span class="ico">⚙</span><span>Settings</span></a></nav>
  <div class="side-foot">EVE PROJECT CONTROL<br>Prototype · Local workspace</div>
</aside>
<main class="main">
<header class="top"><input id="globalSearch" class="search" placeholder="Search projects, IDs, clients…"><div class="top-right"><span class="badge">PROTOTYPE · INTERNAL</span><div class="avatar">EVE</div></div></header>
<div id="app"></div>
</main>
</div>

<div class="modal" id="projectModal">
 <div class="modal-card">
  <div class="modal-head"><h2>Add New Project</h2><button class="close" onclick="closeModal()">×</button></div>
  <form class="form" id="projectForm">
   <div class="form-grid">
    <label>Project name *<input name="name" required placeholder="e.g. Substation Protection Upgrade"></label>
    <label>Client / organisation *<input name="client" required placeholder="Client name"></label>
   </div>
   <div class="form-grid">
    <label>Project type<select name="type"><option>Electrical Design</option><option>Substation / HV</option><option>Industrial</option><option>Commercial</option><option>Renewables</option><option>Drafting & Documentation</option></select></label>
    <label>Priority<select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label>
   </div>
   <div class="form-grid">
    <label>Project lead<select name="lead"><option>Alex Patel</option><option>Sam Robinson</option><option>Jordan Lee</option><option>Mia Chen</option></select></label>
    <label>Target date<input type="date" name="date"></label>
   </div>
   <label>Scope / description<textarea name="description" placeholder="Brief scope, deliverables or notes"></textarea></label>
   <div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Create Project</button></div>
  </form>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const seedProjects=[
{id:"EVE-2026-014",name:"Electrical Substation Upgrade",client:"Utility Infrastructure",type:"Substation / HV",status:"Active",priority:"High",lead:"Alex Patel",date:"2026-11-18",progress:68,description:"Protection, control and electrical design package for an HV substation upgrade.",tasks:12,open:4,docs:18},
{id:"EVE-2026-011",name:"Industrial Distribution Upgrade",client:"Industrial Client",type:"Industrial",status:"Active",priority:"Medium",lead:"Sam Robinson",date:"2026-10-30",progress:52,description:"LV/MV distribution design and documentation for an industrial facility.",tasks:18,open:7,docs:24},
{id:"EVE-2026-009",name:"Commercial Solar & HV Connection",client:"Renewable Developer",type:"Renewables",status:"Planning",priority:"Medium",lead:"Mia Chen",date:"2026-12-08",progress:24,description:"Electrical design and connection documentation for a commercial solar project.",tasks:9,open:6,docs:11},
{id:"EVE-2026-006",name:"Commercial Building Electrical Design",client:"Property Group",type:"Commercial",status:"Active",priority:"Low",lead:"Jordan Lee",date:"2026-10-22",progress:81,description:"Electrical services design and coordinated construction documentation.",tasks:21,open:3,docs:31}
];
let projects=JSON.parse(localStorage.getItem("eveProjectControlProjects")||"null")||seedProjects;
let tasks=[
["EVE-2026-014","Issue protection SLD for review","Alex Patel","High","2026-10-14","In Review"],
["EVE-2026-014","Complete cable schedule","Sam Robinson","Medium","2026-10-16","In Progress"],
["EVE-2026-011","Update switchboard drawings","Jordan Lee","Medium","2026-10-12","In Progress"],
["EVE-2026-006","Client drawing review comments","Mia Chen","High","2026-10-10","Pending"],
["EVE-2026-009","Confirm connection requirements","Alex Patel","Medium","2026-10-18","Pending"]
];
let currentProject=null;

function save(){localStorage.setItem("eveProjectControlProjects",JSON.stringify(projects))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function fmt(d){if(!d)return "—";return new Date(d+"T00:00:00").toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"})}
function project(id){return projects.find(p=>p.id===id)}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function nav(page){location.hash=page}
function shell(title,sub,actions=""){return '<div class="page"><div class="head"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div>'+actions+'</div></div></div>'}
function kpi(label,val,delta){return '<div class="card kpi"><div class="kpi-top"><span>'+label+'</span><span>●</span></div><strong>'+val+'</strong><div class="delta">'+delta+'</div></div>'}
function projectRows(list){return list.map(p=>'<tr class="click" onclick="openProject(\''+p.id+'\')"><td><span class="pid">'+esc(p.id)+'</span><div class="pname">'+esc(p.name)+'</div><div class="muted">'+esc(p.client)+'</div></td><td>'+esc(p.type)+'</td><td><span class="status '+p.status+'">'+esc(p.status)+'</span></td><td><span class="priority '+p.priority+'">'+esc(p.priority)+'</span></td><td>'+esc(p.lead)+'</td><td><div style="min-width:90px"><div class="progress"><i style="width:'+p.progress+'%"></i></div><small class="muted">'+p.progress+'%</small></div></td><td>'+fmt(p.date)+'</td></tr>').join("")}
function dashboard(){
const active=projects.filter(p=>p.status==="Active").length;
return '<div class="page">'+
'<div class="head"><div><h1>Project Control</h1><p>Engineering delivery overview for EVE Design &amp; Engineering.</p></div><button class="primary" onclick="openModal()">＋ Add Project</button></div>'+
'<div class="notice"><b>Prototype workspace:</b> projects you create are saved in this browser. Before storing confidential project information, connect this interface to authenticated server-side storage.</div>'+
'<div class="cards">'+kpi("Active Projects",active,"Live delivery workload")+kpi("Due This Week",3,"Review upcoming deadlines")+kpi("Open Tasks",tasks.length,"Across current projects")+kpi("Documents",projects.reduce((a,p)=>a+p.docs,0),"Tracked project documents")+'</div>'+
'<div class="grid"><section class="card panel"><div class="panel-title"><h2>Current Projects</h2><span>'+projects.length+' total</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Project</th><th>Type</th><th>Status</th><th>Priority</th><th>Lead</th><th>Progress</th><th>Target</th></tr></thead><tbody>'+projectRows(projects.slice(0,6))+'</tbody></table></div></section>'+
'<section class="card panel"><div class="panel-title"><h2>Recent Activity</h2><span>Today</span></div><div class="side-list">'+
'<div class="activity"><i class="dot"></i><div><b>Protection SLD moved to review</b><p>EVE-2026-014 · 32 min ago</p></div></div>'+
'<div class="activity"><i class="dot"></i><div><b>Drawing package updated</b><p>EVE-2026-011 · 1 hr ago</p></div></div>'+
'<div class="activity"><i class="dot"></i><div><b>Client review comments received</b><p>EVE-2026-006 · 2 hrs ago</p></div></div>'+
'<div class="activity"><i class="dot"></i><div><b>New project created</b><p>Workspace activity · 4 hrs ago</p></div></div></div></section></div></div>'
}
function projectsPage(){
return '<div class="page"><div class="head"><div><h1>Projects</h1><p>Track every engineering project from planning through delivery.</p></div><button class="primary" onclick="openModal()">＋ Add Project</button></div>'+
'<div class="filterbar"><input id="projectSearch" placeholder="Search project name, ID or client…" oninput="filterProjects()"><select id="statusFilter" onchange="filterProjects()"><option value="">All statuses</option><option>Active</option><option>Planning</option><option>On Hold</option><option>Completed</option></select><select id="priorityFilter" onchange="filterProjects()"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div>'+
'<section class="card panel"><div class="table-wrap"><table class="table"><thead><tr><th>Project</th><th>Type</th><th>Status</th><th>Priority</th><th>Lead</th><th>Progress</th><th>Target</th></tr></thead><tbody id="projectRows">'+projectRows(projects)+'</tbody></table></div></section></div>'
}
function filterProjects(){const q=(document.getElementById("projectSearch")?.value||"").toLowerCase(),s=document.getElementById("statusFilter")?.value||"",pr=document.getElementById("priorityFilter")?.value||"";const list=projects.filter(p=>(!q||[p.id,p.name,p.client,p.type].join(" ").toLowerCase().includes(q))&&(!s||p.status===s)&&(!pr||p.priority===pr));document.getElementById("projectRows").innerHTML=list.length?projectRows(list):'<tr><td colspan="7"><div class="empty">No projects match your filters.</div></td></tr>'}
function openProject(id){currentProject=id;location.hash="project/"+encodeURIComponent(id)}
function projectDetail(id){
const p=project(id);if(!p){nav("projects");return ""}return '<div class="page project-detail show"><button class="back" onclick="nav(\'projects\')">← Back to Projects</button><div class="detail-head"><div><span class="pid">'+esc(p.id)+'</span><h1>'+esc(p.name)+'</h1><p class="muted">'+esc(p.client)+' · '+esc(p.type)+'</p></div><button class="secondary" onclick="toast(\'Project actions are available in the full system build.\')">Project Actions ▾</button></div><div class="detail-meta" style="margin-top:12px"><span class="status '+p.status+'">'+p.status+'</span><span class="priority '+p.priority+'">'+p.priority+' Priority</span><span class="muted" style="font-size:11px">Lead: <b>'+esc(p.lead)+'</b></span><span class="muted" style="font-size:11px">Target: <b>'+fmt(p.date)+'</b></span></div>'+
'<div class="tabs"><button class="tab active" onclick="tab(this,\'overview\')">Overview</button><button class="tab" onclick="tab(this,\'tasks\')">Tasks</button><button class="tab" onclick="tab(this,\'milestones\')">Milestones</button><button class="tab" onclick="tab(this,\'docs\')">Documents</button><button class="tab" onclick="tab(this,\'approvals\')">Approvals</button><button class="tab" onclick="tab(this,\'activity\')">Activity</button></div>'+
'<div id="overview" class="tabpane active"><div class="twocol"><section class="card panel"><div class="panel-title"><h2>Project summary</h2><span>'+p.progress+'% complete</span></div><p style="font-size:12px;line-height:1.65">'+esc(p.description)+'</p><div class="progress" style="margin:18px 0 5px"><i style="width:'+p.progress+'%"></i></div><div class="muted" style="font-size:10px">'+p.progress+'% delivery progress</div></section><section class="card panel"><div class="panel-title"><h2>Project information</h2></div><div class="info-grid"><div class="info"><small>Project ID</small><b>'+p.id+'</b></div><div class="info"><small>Target date</small><b>'+fmt(p.date)+'</b></div><div class="info"><small>Tasks</small><b>'+p.tasks+' total</b></div><div class="info"><small>Documents</small><b>'+p.docs+' tracked</b></div></div></section></div></div>'+
'<div id="tasks" class="tabpane"><section class="card panel"><div class="panel-title"><h2>Project tasks</h2><button class="secondary" onclick="addTask()">＋ Add Task</button></div>'+taskTable(id)+'</section></div>'+
'<div id="milestones" class="tabpane"><section class="card panel"><div class="panel-title"><h2>Milestones</h2></div>'+['Design basis approved','Draft drawings complete','Internal QA review','Client issue','Construction / delivery'].map((x,i)=>'<div style="display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f4"><div style="width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:'+(i<p.progress/20?'#e5f7ef':'#f0f3f6')+';color:'+(i<p.progress/20?'#15805a':'#7a8795')+'">'+(i<p.progress/20?'✓':i+1)+'</div><div style="font-size:12px;font-weight:700">'+x+'</div><span class="muted" style="margin-left:auto;font-size:10px">'+(i<p.progress/20?'Complete':'Pending')+'</span></div>').join('')+'</section></div>'+
'<div id="docs" class="tabpane"><section class="card panel"><div class="panel-title"><h2>Documents</h2><button class="secondary" onclick="toast(\'Document upload will be enabled with secure storage.\')">＋ Add Document</button></div><table class="table"><thead><tr><th>Document</th><th>Type</th><th>Status</th><th>Revision</th></tr></thead><tbody><tr><td><b>Electrical Single-Line Diagram</b></td><td>Drawing</td><td><span class="status Active">For Review</span></td><td>Rev C</td></tr><tr><td><b>Substation Layout</b></td><td>Drawing</td><td><span class="status Completed">Approved</span></td><td>Rev B</td></tr><tr><td><b>Design Report</b></td><td>Report</td><td><span class="status Planning">Draft</span></td><td>Rev A</td></tr></tbody></table></section></div>'+
'<div id="approvals" class="tabpane"><section class="card panel"><div class="panel-title"><h2>Approvals</h2></div><div class="empty">No approval workflow actions have been configured for this prototype project.</div></section></div>'+
'<div id="activity" class="tabpane"><section class="card panel"><div class="panel-title"><h2>Project activity</h2></div><div class="side-list"><div class="activity"><i class="dot"></i><div><b>Project status updated</b><p>'+p.status+' · Today</p></div></div><div class="activity"><i class="dot"></i><div><b>Drawing package updated</b><p>Yesterday</p></div></div><div class="activity"><i class="dot"></i><div><b>Project created</b><p>Workspace history</p></div></div></div></section></div></div>'
}
function taskTable(id){const ts=tasks.filter(t=>t[0]===id);return ts.length?'<table class="table"><thead><tr><th>Task</th><th>Assignee</th><th>Priority</th><th>Due</th><th>Status</th></tr></thead><tbody>'+ts.map(t=>'<tr><td><b>'+esc(t[1])+'</b></td><td>'+esc(t[2])+'</td><td><span class="priority '+t[3]+'">'+t[3]+'</span></td><td>'+fmt(t[4])+'</td><td><span class="status Planning">'+t[5]+'</span></td></tr>').join('')+'</tbody></table>':'<div class="empty">No tasks yet. Add the first project task.</div>'}
function tasksPage(){return '<div class="page"><div class="head"><div><h1>Tasks</h1><p>Cross-project actions, reviews and delivery items.</p></div></div><section class="card panel"><table class="table"><thead><tr><th>Project</th><th>Task</th><th>Assignee</th><th>Priority</th><th>Due</th><th>Status</th></tr></thead><tbody>'+tasks.map(t=>'<tr><td><span class="pid">'+t[0]+'</span></td><td><b>'+esc(t[1])+'</b></td><td>'+esc(t[2])+'</td><td><span class="priority '+t[3]+'">'+t[3]+'</span></td><td>'+fmt(t[4])+'</td><td><span class="status Planning">'+t[5]+'</span></td></tr>').join('')+'</tbody></table></section></div>'}
function simplePage(title,sub,body){return '<div class="page"><div class="head"><div><h1>'+title+'</h1><p>'+sub+'</p></div></div>'+body+'</div>'}
function render(){const h=location.hash.replace("#","")||"dashboard";document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a.dataset.page===h.split("/")[0]));let out=h.startsWith("project/")?projectDetail(decodeURIComponent(h.slice(8))):h==="projects"?projectsPage():h==="tasks"?tasksPage():h==="documents"?simplePage("Documents","Central register for project drawings, reports and technical records.",'<section class="card panel"><div class="empty">Document register ready. Secure file storage and revision control are planned for the production build.</div></section>'):h==="team"?simplePage("Team","Project leads and delivery roles.",'<section class="card panel"><table class="table"><thead><tr><th>Team member</th><th>Role</th><th>Active projects</th><th>Availability</th></tr></thead><tbody><tr><td><b>Alex Patel</b></td><td>Senior Electrical Engineer</td><td>3</td><td><span class="status Active">Available</span></td></tr><tr><td><b>Sam Robinson</b></td><td>Electrical Designer</td><td>2</td><td><span class="status Active">Available</span></td></tr><tr><td><b>Jordan Lee</b></td><td>Project Engineer</td><td>2</td><td><span class="status Planning">Allocated</span></td></tr><tr><td><b>Mia Chen</b></td><td>Engineering Support</td><td>2</td><td><span class="status Active">Available</span></td></tr></tbody></table></section>'):h==="reports"?simplePage("Reports","Delivery performance and project portfolio reporting.",'<div class="cards">'+kpi("Portfolio Progress",57+"%","Weighted prototype view")+kpi("High Priority",projects.filter(p=>p.priority==="High").length,"Projects requiring attention")+kpi("In Planning",projects.filter(p=>p.status==="Planning").length,"Pipeline workload")+kpi("On Target",projects.filter(p=>p.progress>=50).length,"Projects above 50%")+'</div><section class="card panel"><div class="panel-title"><h2>Portfolio progress</h2></div>'+projects.map(p=>'<div style="display:grid;grid-template-columns:220px 1fr 45px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #edf1f4;font-size:11px"><b>'+esc(p.name)+'</b><div class="progress"><i style="width:'+p.progress+'%"></i></div><span>'+p.progress+'%</span></div>').join('')+'</section>'):h==="settings"?simplePage("Settings","Workspace preferences and future production controls.",'<section class="card panel"><div class="info-grid"><div class="info"><small>Workspace</small><b>EVE Project Control</b></div><div class="info"><small>Data mode</small><b>Browser local storage</b></div><div class="info"><small>Production security</small><b>Authentication required</b></div><div class="info"><small>Route</small><b>/project-tracker/</b></div></div></section>'):dashboard();document.getElementById("app").innerHTML=out}
function openModal(){document.getElementById("projectModal").classList.add("show")}
function closeModal(){document.getElementById("projectModal").classList.remove("show")}
document.getElementById("projectForm").addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.target),num=String(Math.max(0,...projects.map(p=>Number((p.id.match(/(\d+)$/)||[0,0])[1])))+1).padStart(3,"0");projects.unshift({id:"EVE-2026-"+num,name:f.get("name"),client:f.get("client"),type:f.get("type"),status:"Planning",priority:f.get("priority"),lead:f.get("lead"),date:f.get("date"),progress:0,description:f.get("description")||"Project scope to be defined.",tasks:0,open:0,docs:0});save();e.target.reset();closeModal();toast("Project created successfully");nav("projects")});
function tab(btn,id){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tabpane").forEach(x=>x.classList.remove("active"));btn.classList.add("active");document.getElementById(id).classList.add("active")}
function addTask(){const name=prompt("Task name");if(!name)return;tasks.push([currentProject,name,"Unassigned","Medium","2026-10-30","Pending"]);toast("Task added to project");render()}
document.getEventListener?.("click",()=>{});
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){nav("projects");setTimeout(()=>{const x=document.getElementById("projectSearch");if(x){x.value=e.target.value;filterProjects()}},20)}});
window.addEventListener("hashchange",render);render();
