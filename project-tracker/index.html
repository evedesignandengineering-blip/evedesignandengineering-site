<script>
const SUPABASE_URL="https://hszkloepnewfkzdegfhl.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Avjn-CGtbEdeLaxSWCwQDw_36mgImSu";
if(!window.supabase){document.getElementById("authGate").innerHTML='<div class="login"><div class="loginbox"><div class="loginbrand">EVE</div><h1>Unable to load Project Control</h1><p>The secure database library could not be loaded. Please refresh the page.</p></div></div>';throw new Error("Supabase client library did not load.");} const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const KEY="eveProjectControlDataV2";
let authUser=null; let remoteMode=true;
const defaultData={users:[],projects:[
{id:"EVE-2026-014",name:"Electrical Substation Upgrade",client:"Utility Infrastructure",type:"Substation / HV",status:"Active",priority:"High",leadId:null,date:"2026-11-18",progress:68,description:"Protection, control and electrical design package for an HV substation upgrade."},
{id:"EVE-2026-011",name:"Industrial Distribution Upgrade",client:"Industrial Client",type:"Industrial",status:"Active",priority:"Medium",leadId:null,date:"2026-10-30",progress:52,description:"LV/MV distribution design and documentation for an industrial facility."},
{id:"EVE-2026-009",name:"Commercial Solar & HV Connection",client:"Renewable Developer",type:"Renewables",status:"Planning",priority:"Medium",leadId:null,date:"2026-12-08",progress:24,description:"Electrical design and connection documentation for a commercial solar project."},
{id:"EVE-2026-006",name:"Commercial Building Electrical Design",client:"Property Group",type:"Commercial",status:"Active",priority:"Low",leadId:null,date:"2026-10-22",progress:81,description:"Electrical services design and coordinated construction documentation."}],tasks:[],documents:[],activities:[]};
let data=load();let currentProject=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.projects)return x;const old=JSON.parse(localStorage.getItem("eveProjectControlProjects")||"null");if(old){defaultData.projects=old.map(p=>({...p,leadId:null}));}return structuredClone(defaultData)}catch(e){return structuredClone(defaultData)}}
async function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
 if(!remoteMode||!authUser)return;
 try{
  await Promise.all([
   supabase.from("profiles").upsert(data.users.map(u=>({id:u.id,name:u.name,role:u.role||"Viewer",email:u.email||null}))),
   supabase.from("projects").upsert(data.projects.map(p=>({id:p.id,name:p.name,client:p.client,type:p.type,status:p.status,priority:p.priority,lead_id:p.leadId||null,target_date:p.date||null,progress:Number(p.progress||0),description:p.description||null}))),
   supabase.from("tasks").upsert(data.tasks.map(t=>({id:t.id,project_id:t.projectId,title:t.title,assignee_id:t.assigneeId||null,priority:t.priority,due_date:t.due||null,status:t.status}))),
   supabase.from("milestones").upsert(data.milestones||[]),
   supabase.from("documents").upsert(data.documents||[]),
   supabase.from("activities").upsert((data.activities||[]).map(a=>({id:a.id,action:a.text,created_at:a.time,user_id:null,project_id:null})))
  ]);
 }catch(e){console.error("Supabase sync",e)}
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(d){return d?new Date(d+"T00:00:00").toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"}):"—"}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}
function initials(n){return (n||"EVE").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function user(id){return data.users.find(u=>u.id===id)}
function proj(id){return data.projects.find(p=>p.id===id)}
function leadName(p){return user(p.leadId)?.name||"Unassigned"}
function toast(s){const x=document.getElementById("toast");x.textContent=s;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}
function openModal(html){document.getElementById("modalbox").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
async function loadRemote(){
 const [u,p,t,m,d,a]=await Promise.all([
  supabase.from("profiles").select("*").order("name"),
  supabase.from("projects").select("*").order("created_at",{ascending:false}),
  supabase.from("tasks").select("*").order("created_at",{ascending:false}),
  supabase.from("milestones").select("*"),
  supabase.from("documents").select("*"),
  supabase.from("activities").select("*").order("created_at",{ascending:false}).limit(50)
 ]);
 if(u.error||p.error||t.error){throw (u.error||p.error||t.error)}
 data={
  users:(u.data||[]).map(x=>({id:x.id,name:x.name,role:x.role,email:x.email||""})),
  projects:(p.data||[]).map(x=>({id:x.id,name:x.name,client:x.client,type:x.type,status:x.status,priority:x.priority,leadId:x.lead_id,date:x.target_date,progress:x.progress,description:x.description||""})),
  tasks:(t.data||[]).map(x=>({id:x.id,projectId:x.project_id,title:x.title,assigneeId:x.assignee_id,priority:x.priority,due:x.due_date,status:x.status})),
  milestones:m.data||[],documents:d.data||[],activities:(a.data||[]).map(x=>({id:x.id,text:x.action,time:new Date(x.created_at).toLocaleString("en-AU",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}))
 };
 localStorage.setItem(KEY,JSON.stringify(data));
}function showLogin(){
 document.getElementById("appShell").style.display="none";
 document.getElementById("authGate").innerHTML='<div class="login"><div class="loginbox"><div class="loginbrand">EVE</div><div class="muted">DESIGN &amp; ENGINEERING · PROJECT CONTROL</div><h1>Sign in</h1><p>Use your EVE company email address to access the shared project workspace.</p><form id="loginForm"><div class="field"><label>Email<input name="email" type="email" required placeholder="name@evedesignandengineering.com"></label></div><div class="field"><label>Password<input name="password" type="password" required></label></div><button class="primary">Sign in</button><button type="button" class="secondary" style="width:100%;margin-top:8px" onclick="showSignup()">Create employee account</button><div id="loginMsg" class="loginmsg"></div></form></div></div>';
 document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const email=String(f.get("email")).trim().toLowerCase();if(!email.endsWith("@evedesignandengineering.com")){document.getElementById("loginMsg").textContent="Use your @evedesignandengineering.com account.";return}const {error}=await supabase.auth.signInWithPassword({email,password:f.get("password")});if(error)document.getElementById("loginMsg").textContent=error.message};
}
async function initApp(){
 const {data:s}=await supabase.auth.getSession(); authUser=s.session?.user||null;
 supabase.auth.onAuthStateChange((_e,session)=>{authUser=session?.user||null;if(authUser) location.reload(); else showLogin()});
 if(!authUser){showLogin();return}
 try{await loadRemote();document.getElementById("authGate").innerHTML="";document.getElementById("appShell").style.display="block";render();}catch(e){document.getElementById("authGate").innerHTML='<div class="login"><div class="loginbox"><h1>Database setup required</h1><p>Supabase is connected, but the project tables are not ready yet. Run <b>project-tracker/supabase-schema.sql</b> once in the Supabase SQL Editor, then refresh this page.</p><p>'+esc(e.message||e)+'</p></div></div>'}
}
async function showSignup(){
 document.getElementById("authGate").innerHTML='<div class="login"><div class="loginbox"><div class="loginbrand">EVE</div><div class="muted">DESIGN &amp; ENGINEERING · PROJECT CONTROL</div><h1>Create employee account</h1><p>Use your company email. A confirmation email may be required by your Supabase authentication settings.</p><form id="signupForm"><div class="field"><label>Name<input name="name" required placeholder="Your full name"></label></div><div class="field"><label>Email<input name="email" type="email" required placeholder="name@evedesignandengineering.com"></label></div><div class="field"><label>Password<input name="password" type="password" minlength="8" required></label></div><button class="primary">Create account</button><button type="button" class="secondary" style="width:100%;margin-top:8px" onclick="showLogin()">Back to sign in</button><div id="loginMsg" class="loginmsg"></div></form></div></div>';
 document.getElementById("signupForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const email=String(f.get("email")).trim().toLowerCase();if(!email.endsWith("@evedesignandengineering.com")){document.getElementById("loginMsg").textContent="Use your @evedesignandengineering.com account.";return}const {error}=await supabase.auth.signUp({email,password:f.get("password"),options:{data:{name:f.get("name")}}});document.getElementById("loginMsg").textContent=error?error.message:"Account created. Check your company email if confirmation is required, then sign in."};
}
async function logout(){await supabase.auth.signOut()}

function addActivity(text){data.activities.unshift({id:uid(),text,time:new Date().toLocaleString("en-AU",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})});data.activities=data.activities.slice(0,30);save()}

function kpi(a,b,c){return '<div class="card kpi"><small>'+a+'</small><strong>'+b+'</strong><em>'+c+'</em></div>'}
function dashboard(){return '<div class="page"><div class="head"><div><h1>Project Control</h1><p>Live project, task and team overview for EVE Design &amp; Engineering.</p></div><button class="primary" onclick="newProject()">＋ Add Project</button></div><div class="notice"><b>Data is active in this browser.</b> Changes to projects, users, progress and tasks are saved automatically for this workspace. Multi-device shared storage requires a server database.</div><div class="cards">'+kpi("Active Projects",data.projects.filter(p=>p.status==="Active").length,"Current delivery")+kpi("Total Projects",data.projects.length,"Portfolio")+kpi("Open Tasks",data.tasks.filter(t=>t.status!=="Completed").length,"Across all projects")+kpi("Team Members",data.users.length,"Users configured")+'</div><div class="grid"><section class="card panel"><div class="ptitle"><h2>Projects</h2><span>'+data.projects.length+' total</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Project</th><th>Type</th><th>Status</th><th>Priority</th><th>Lead</th><th>Progress</th><th>Target</th></tr></thead><tbody>'+projectRows(data.projects)+'</tbody></table></div></section><section class="card panel"><div class="ptitle"><h2>Activity</h2><span>Latest changes</span></div>'+(data.activities.length?data.activities.slice(0,8).map(a=>'<div class="activity"><i class="dot"></i><div><b>'+esc(a.text)+'</b><p>'+esc(a.time)+'</p></div></div>').join(""):'<div class="empty">No activity yet.</div>')+'</section></div></div>'}
function newProject(){openProjectForm()}
function projectForm(p){const editing=!!p;return '<div class="modalhead"><h2>'+(editing?"Edit Project":"Add New Project")+'</h2><button class="close" onclick="closeModal()">×</button></div><form class="form" id="projectForm"><div class="formgrid"><div class="field"><label>Project name *<input name="name" required value="'+esc(p?.name||"")+'"></label></div><div class="field"><label>Client / organisation *<input name="client" required value="'+esc(p?.client||"")+'"></label></div></div><div class="formgrid"><div class="field"><label>Project type<select name="type">'+["Electrical Design","Substation / HV","Industrial","Commercial","Renewables","Drafting & Documentation"].map(x=>'<option '+(p?.type===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label></div><div class="field"><label>Priority<select name="priority">'+["High","Medium","Low"].map(x=>'<option '+(p?.priority===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label></div></div><div class="formgrid"><div class="field"><label>Project lead<select name="lead"><option value="">Unassigned</option>'+data.users.map(u=>'<option value="'+u.id+'" '+(p?.leadId===u.id?"selected":"")+'>'+esc(u.name)+' — '+esc(u.role)+'</option>').join("")+'</select></label></div><div class="field"><label>Status<select name="status">'+["Planning","Active","On Hold","Completed"].map(x=>'<option '+(p?.status===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label></div></div><div class="formgrid"><div class="field"><label>Target date<input type="date" name="date" value="'+(p?.date||"")+'"></label></div><div class="field"><label>Progress<div class="range"><input id="progressInput" type="range" name="progress" min="0" max="100" value="'+(p?.progress??0)+'" oninput="progressOutput.value=this.value+'+'\'%\''+'"><output id="progressOutput">'+(p?.progress??0)+'%</output></div></label></div></div><div class="field"><label>Scope / description<textarea name="description">'+esc(p?.description||"")+'</textarea></label></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">'+(editing?"Save Changes":"Create Project")+'</button></div></form>'}
function openProjectForm(id){const p=id?proj(id):null;openModal(projectForm(p));document.getElementById("projectForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(p){Object.assign(p,{name:f.get("name"),client:f.get("client"),type:f.get("type"),priority:f.get("priority"),leadId:f.get("lead")||null,status:f.get("status"),date:f.get("date"),progress:Number(f.get("progress")),description:f.get("description")});addActivity("Updated project "+p.id)}else{const n=Math.max(0,...data.projects.map(x=>Number((x.id.match(/(\d+)$/)||[0,0])[1])))+1;const np={id:"EVE-2026-"+String(n).padStart(3,"0"),name:f.get("name"),client:f.get("client"),type:f.get("type"),priority:f.get("priority"),leadId:f.get("lead")||null,status:f.get("status"),date:f.get("date"),progress:Number(f.get("progress")),description:f.get("description")};data.projects.unshift(np);addActivity("Created project "+np.id)}save();closeModal();toast(p?"Project updated":"Project created");location.hash=p?"project/"+encodeURIComponent(p.id):"projects"}}
function projectsPage(){return '<div class="page"><div class="head"><div><h1>Projects</h1><p>Create, edit and control every project field.</p></div><button class="primary" onclick="newProject()">＋ Add Project</button></div><div class="filter"><input id="ps" placeholder="Search projects, clients or IDs…" oninput="filterProjects()"><select id="pstatus" onchange="filterProjects()"><option value="">All statuses</option><option>Planning</option><option>Active</option><option>On Hold</option><option>Completed</option></select><select id="ppriority" onchange="filterProjects()"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div><section class="card panel"><div class="tablewrap"><table class="table"><thead><tr><th>Project</th><th>Type</th><th>Status</th><th>Priority</th><th>Lead</th><th>Progress</th><th>Target</th></tr></thead><tbody id="projectRows">'+projectRows(data.projects)+'</tbody></table></div></section></div>'}
function filterProjects(){const q=(document.getElementById("ps")?.value||"").toLowerCase(),s=document.getElementById("pstatus")?.value||"",pr=document.getElementById("ppriority")?.value||"";const l=data.projects.filter(p=>(!q||[p.id,p.name,p.client,p.type,leadName(p)].join(" ").toLowerCase().includes(q))&&(!s||p.status===s)&&(!pr||p.priority===pr));document.getElementById("projectRows").innerHTML=l.length?projectRows(l):'<tr><td colspan="7"><div class="empty">No projects found.</div></td></tr>'}
function goProject(id){location.hash="project/"+encodeURIComponent(id)}
function projectDetail(id){const p=proj(id);if(!p){location.hash="projects";return ""}const pts=data.tasks.filter(t=>t.projectId===id);return '<div class="page"><button class="linkbtn" onclick="location.hash=\'projects\'">← Back to Projects</button><div class="detail-head" style="margin-top:14px"><div><span class="pid">'+p.id+'</span><h1>'+esc(p.name)+'</h1><div class="muted">'+esc(p.client)+' · '+esc(p.type)+'</div></div><div class="smallactions"><button class="secondary" onclick="openProjectForm(\''+p.id+'\')">Edit Project</button><button class="danger" onclick="deleteProject(\''+p.id+'\')">Delete</button></div></div><div class="meta"><span class="status '+p.status.replace(" ","-")+'">'+p.status+'</span><span class="priority '+p.priority+'">'+p.priority+'</span><span class="muted">Lead: <b>'+esc(leadName(p))+'</b></span><span class="muted">Target: <b>'+fmt(p.date)+'</b></span></div><div class="tabs"><button class="tab active" onclick="tab(this,\'overview\')">Overview</button><button class="tab" onclick="tab(this,\'tasks\')">Tasks</button><button class="tab" onclick="tab(this,\'milestones\')">Milestones</button><button class="tab" onclick="tab(this,\'documents\')">Documents</button><button class="tab" onclick="tab(this,\'activity\')">Activity</button></div><div id="overview" class="pane active"><div class="twocol"><section class="card panel"><div class="ptitle"><h2>Delivery progress</h2><b>'+p.progress+'%</b></div><div class="progress" style="height:9px"><i style="width:'+p.progress+'%"></i></div><div style="margin-top:16px;line-height:1.7;font-size:11px">'+esc(p.description||"No description.")+'</div><button class="secondary" style="margin-top:15px" onclick="openProjectForm(\''+p.id+'\')">Edit progress / project details</button></section><section class="card panel"><div class="ptitle"><h2>Project information</h2></div><div class="info-grid"><div class="info"><small>Project ID</small><b>'+p.id+'</b></div><div class="info"><small>Status</small><b>'+p.status+'</b></div><div class="info"><small>Tasks</small><b>'+pts.length+'</b></div><div class="info"><small>Lead</small><b>'+esc(leadName(p))+'</b></div></div></section></div></div><div id="tasks" class="pane"><section class="card panel"><div class="ptitle"><h2>Tasks</h2><button class="primary" onclick="taskForm(\''+p.id+'\')">＋ Add Task</button></div>'+taskTable(id)+'</section></div><div id="milestones" class="pane"><section class="card panel"><div class="empty">Milestones can be managed as project tasks in this build. Use task status and due dates for delivery control.</div></section></div><div id="documents" class="pane"><section class="card panel"><div class="ptitle"><h2>Documents</h2><button class="secondary" onclick="toast(\'Secure document storage is the next server-side module.\')">＋ Add Document</button></div><div class="empty">No documents have been uploaded to this project.</div></section></div><div id="activity" class="pane"><section class="card panel"><div class="ptitle"><h2>Project activity</h2></div><div class="empty">Project changes are recorded in the workspace activity feed.</div></section></div></div>'}
function taskTable(pid){const ts=data.tasks.filter(t=>t.projectId===pid);if(!ts.length)return '<div class="empty">No tasks yet. Add the first task.</div>';return '<div class="tablewrap"><table class="table"><thead><tr><th>Task</th><th>Assignee</th><th>Priority</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>'+ts.map(t=>'<tr><td><b>'+esc(t.title)+'</b></td><td>'+esc(user(t.assigneeId)?.name||"Unassigned")+'</td><td><span class="priority '+t.priority+'">'+t.priority+'</span></td><td>'+fmt(t.due)+'</td><td><span class="status '+(t.status==="Completed"?"Completed":"Planning")+'">'+t.status+'</span></td><td><button class="linkbtn" onclick="taskForm(\''+pid+'\',\''+t.id+'\')">Edit</button></td></tr>').join("")+'</tbody></table></div>'}
function taskForm(pid,tid){const t=tid?data.tasks.find(x=>x.id===tid):null;openModal('<div class="modalhead"><h2>'+(t?"Edit Task":"Add Task")+'</h2><button class="close" onclick="closeModal()">×</button></div><form class="form" id="taskForm"><div class="field"><label>Task name *<input name="title" required value="'+esc(t?.title||"")+'"></label></div><div class="formgrid"><div class="field"><label>Assignee<select name="assignee"><option value="">Unassigned</option>'+data.users.map(u=>'<option value="'+u.id+'" '+(t?.assigneeId===u.id?"selected":"")+'>'+esc(u.name)+'</option>').join("")+'</select></label></div><div class="field"><label>Priority<select name="priority">'+["High","Medium","Low"].map(x=>'<option '+(t?.priority===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label></div></div><div class="formgrid"><div class="field"><label>Due date<input type="date" name="due" value="'+(t?.due||"")+'"></label></div><div class="field"><label>Status<select name="status">'+["Pending","In Progress","In Review","Completed"].map(x=>'<option '+(t?.status===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label></div></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save Task</button></div></form>');document.getElementById("taskForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(t)Object.assign(t,{title:f.get("title"),assigneeId:f.get("assignee")||null,priority:f.get("priority"),due:f.get("due"),status:f.get("status")});else data.tasks.push({id:uid(),projectId:pid,title:f.get("title"),assigneeId:f.get("assignee")||null,priority:f.get("priority"),due:f.get("due"),status:f.get("status")});addActivity((t?"Updated":"Added")+" task on "+pid);save();closeModal();toast("Task saved");render()}}
function tasksPage(){return '<div class="page"><div class="head"><div><h1>Tasks</h1><p>Manage tasks across all projects.</p></div></div><section class="card panel"><div class="tablewrap"><table class="table"><thead><tr><th>Project</th><th>Task</th><th>Assignee</th><th>Priority</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>'+(data.tasks.length?data.tasks.map(t=>'<tr><td><span class="pid">'+t.projectId+'</span></td><td><b>'+esc(t.title)+'</b></td><td>'+esc(user(t.assigneeId)?.name||"Unassigned")+'</td><td><span class="priority '+t.priority+'">'+t.priority+'</span></td><td>'+fmt(t.due)+'</td><td><span class="status '+(t.status==="Completed"?"Completed":"Planning")+'">'+t.status+'</span></td><td><button class="linkbtn" onclick="taskForm(\''+t.projectId+'\',\''+t.id+'\')">Edit</button></td></tr>').join(""):'<tr><td colspan="7"><div class="empty">No tasks have been created.</div></td></tr>')+'</tbody></table></div></section></div>'}
function teamPage(){return '<div class="page"><div class="head"><div><h1>Team</h1><p>Add and manage the actual people who can lead projects and own tasks.</p></div><button class="primary" onclick="userForm()">＋ Add User</button></div><div class="notice"><b>No fake users:</b> this team starts empty. Add your actual EVE team members here, then they will appear automatically in project leads and task assignees.</div><section class="card panel"><table class="table"><thead><tr><th>User</th><th>Role</th><th>Email</th><th>Projects</th><th>Tasks</th><th></th></tr></thead><tbody>'+(data.users.length?data.users.map(u=>'<tr><td><div class="userbox"><span class="usercircle">'+initials(u.name)+'</span><b>'+esc(u.name)+'</b></div></td><td class="role">'+esc(u.role)+'</td><td>'+esc(u.email)+'</td><td>'+data.projects.filter(p=>p.leadId===u.id).length+'</td><td>'+data.tasks.filter(t=>t.assigneeId===u.id&&t.status!=="Completed").length+'</td><td><div class="smallactions"><button class="secondary" onclick="userForm(\''+u.id+'\')">Edit</button><button class="danger" onclick="deleteUser(\''+u.id+'\')">Delete</button></div></td></tr>').join(""):'<tr><td colspan="6"><div class="empty">No users configured. Add your first team member.</div></td></tr>')+'</tbody></table></section></div>'}
function userForm(id){const u=id?user(id):null;openModal('<div class="modalhead"><h2>'+(u?"Edit User":"Add User")+'</h2><button class="close" onclick="closeModal()">×</button></div><form class="form" id="userForm"><div class="formgrid"><div class="field"><label>Full name *<input name="name" required value="'+esc(u?.name||"")+'"></label></div><div class="field"><label>Role<input name="role" value="'+esc(u?.role||"")+'" placeholder="Electrical Engineer"></label></div></div><div class="field"><label>Email<input name="email" type="email" value="'+esc(u?.email||"")+'" placeholder="name@evedesignandengineering.com"></label></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save User</button></div></form>');document.getElementById("userForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(u)Object.assign(u,{name:f.get("name"),role:f.get("role"),email:f.get("email")});else data.users.push({id:uid(),name:f.get("name"),role:f.get("role"),email:f.get("email")});addActivity((u?"Updated user ":"Added user ")+f.get("name"));save();closeModal();toast("User saved");render()}}
function deleteUser(id){if(!confirm("Delete this user? Their projects and tasks will become Unassigned."))return;data.projects.forEach(p=>{if(p.leadId===id)p.leadId=null});data.tasks.forEach(t=>{if(t.assigneeId===id)t.assigneeId=null});const u=user(id);data.users=data.users.filter(x=>x.id!==id);addActivity("Deleted user "+u.name);save();toast("User deleted");render()}
function deleteProject(id){const p=proj(id);if(!confirm("Delete "+p.name+" and its tasks? This cannot be undone."))return;data.projects=data.projects.filter(x=>x.id!==id);data.tasks=data.tasks.filter(x=>x.projectId!==id);addActivity("Deleted project "+id);save();toast("Project deleted");location.hash="projects"}
function documentsPage(){return '<div class="page"><div class="head"><div><h1>Documents</h1><p>Project document register.</p></div></div><section class="card panel"><div class="empty">No documents have been uploaded. Secure document storage and revision control should be connected to server storage before company use.</div></section></div>'}
function reportsPage(){return '<div class="page"><div class="head"><div><h1>Reports</h1><p>Portfolio performance based on your live project data.</p></div></div><div class="cards">'+kpi("Portfolio",data.projects.length,"Projects")+kpi("Average Progress",data.projects.length?Math.round(data.projects.reduce((a,p)=>a+p.progress,0)/data.projects.length)+"%":"0%","Current average")+kpi("Completed Tasks",data.tasks.filter(t=>t.status==="Completed").length,"Task delivery")+kpi("Unassigned",data.projects.filter(p=>!p.leadId).length,"Projects without lead")+'</div><section class="card panel"><div class="ptitle"><h2>Project progress</h2></div>'+data.projects.map(p=>'<div style="display:grid;grid-template-columns:220px 1fr 45px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf1f4;font-size:10px"><b>'+esc(p.name)+'</b><div class="progress"><i style="width:'+p.progress+'%"></i></div><span>'+p.progress+'%</span></div>').join("")+'</section></div>'}
function settingsPage(){return '<div class="page"><div class="head"><div><h1>Settings</h1><p>Workspace controls and data management.</p></div><button class="secondary" onclick="logout()">Sign out</button></div><div class="settings-grid"><section class="card panel"><div class="ptitle"><h2>Workspace</h2></div><div class="info-grid"><div class="info"><small>Company</small><b>EVE Design &amp; Engineering</b></div><div class="info"><small>Route</small><b>/project-tracker/</b></div><div class="info"><small>Storage</small><b>Supabase shared database</b></div><div class="info"><small>Users</small><b>'+data.users.length+'</b></div></div></section><section class="card panel"><div class="ptitle"><h2>Data</h2></div><p class="muted" style="font-size:10px;line-height:1.6">This version stores data in this browser. It is intentionally not presented as secure multi-user storage.</p><button class="danger" onclick="resetData()">Reset prototype data</button></section></div></div>'}
async function resetData(){if(!confirm("Reset all projects, users and tasks?"))return;data=structuredClone(defaultData);await save();toast("Workspace reset");location.hash="dashboard"}
function tab(btn,id){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".pane").forEach(x=>x.classList.remove("active"));btn.classList.add("active");document.getElementById(id).classList.add("active")}
function render(){const h=location.hash.slice(1)||"dashboard";document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a.dataset.page===h.split("/")[0]));let out=h.startsWith("project/")?projectDetail(decodeURIComponent(h.slice(8))):h==="projects"?projectsPage():h==="tasks"?tasksPage():h==="team"?teamPage():h==="documents"?documentsPage():h==="reports"?reportsPage():h==="settings"?settingsPage():dashboard();document.getElementById("app").innerHTML=out}
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){location.hash="projects";setTimeout(()=>{const q=document.getElementById("ps");if(q){q.value=e.target.value;filterProjects()}},30)}})
window.addEventListener("hashchange",render);initApp();
</script>
</body></html>
