<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261020">
<link rel="shortcut icon" href="/favicon.svg?v=20261020">
<title>Website Admin | EVE Design & Engineering</title><link rel="stylesheet" href="styles.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>
body{background:#f2f6fa}.admin-wrap{max-width:520px;margin:8vh auto;padding:24px}.admin-card{background:#fff;border:1px solid #d8e0e8;border-radius:16px;padding:32px;box-shadow:0 12px 32px #09284b12}.admin-card h1{font:800 27px Manrope;color:#09284b;margin:0 0 8px}.admin-card p{color:#566473;line-height:1.6;font-size:14px}.admin-card label{display:block;margin:18px 0 6px;font-weight:700;font-size:13px}.admin-card input{width:100%;font:15px "DM Sans";padding:12px;border:1px solid #cbd6e1;border-radius:7px}.admin-card button{margin-top:20px;width:100%;border:0;border-radius:7px;background:#2f6ea4;color:#fff;padding:13px;font-weight:700;cursor:pointer}.status{margin-top:14px;white-space:pre-wrap;font-size:13px}.back{display:inline-block;margin-top:20px;color:#2f6ea4;font-weight:700}
</style></head><body><div class="admin-wrap"><a class="brand" href="/#home"><strong>EVE</strong><i></i><span>Design &amp;<br>Engineering</span></a><section class="admin-card" style="margin-top:28px"><h1>Website administrator</h1><p>Sign in with your authorised EVE administrator account to edit page text and rearrange supported content blocks. Changes are stored separately from the original website files.</p><form id="login"><label for="email">Administrator email</label><input id="email" type="email" value="admin@evedesignandengineering.com" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><div id="status" class="status" role="status"></div><a class="back" href="/#home">← Return to website</a></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://hszkloepnewfkzdegfhl.supabase.co","sb_publishable_Avjn-CGtbEdeLaxSWCwQDw_36mgImSu");
document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const status=document.getElementById("status");status.textContent="Signing in…";const email=document.getElementById("email").value.trim().toLowerCase();if(email!=="admin@evedesignandengineering.com"){status.textContent="This account is not authorised for website administration.";return;}const {data,error}=await sb.auth.signInWithPassword({email,password:document.getElementById("password").value});if(error){status.textContent="Sign-in failed: "+error.message;return;}const {data:profile,error:pe}=await sb.from("profiles").select("role").eq("id",data.user.id).maybeSingle();if(pe||!profile||String(profile.role).toLowerCase()!=="admin"){await sb.auth.signOut();status.textContent="Your account does not have the required administrator role.";return;}location.href="/tools.html";});
</script></body></html>
